name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[all]"
      - name: Lint
        run: python -m ruff check reposplit tests examples
      - name: Test
        run: python -m pytest
      - name: End-to-end demo run (mock provider, offline)
        run: python -m reposplit run examples/shop_monolith --out out --provider mock --yes
      - name: Verify migration passport signature
        run: python -m reposplit verify out/reports/migration_passport.json
      - uses: actions/upload-artifact@v4
        with:
          name: reposplit-output-py${{ matrix.python-version }}
          path: out/
