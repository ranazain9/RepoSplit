<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RepoSplit 2.0 - Untangling Dashboard (reference client)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --bg:#0b1020; --panel:#121a2f; --ink:#e8ecf5; --muted:#8a96b3; --accent:#4f8cff; --ok:#3ddc97; --warn:#ffb454; --err:#ff5d5d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid #1f2a47; }
  header h1 { font-size:16px; margin:0; letter-spacing:.3px; }
  header input { background:var(--panel); border:1px solid #2a3557; color:var(--ink); padding:8px 10px; border-radius:6px; width:360px; }
  header button { background:var(--accent); color:#fff; border:0; padding:8px 14px; border-radius:6px; cursor:pointer; }
  header button.secondary { background:#2a3557; }
  main { display:grid; grid-template-columns: 1fr 420px; height: calc(100vh - 57px); }
  #graph { position:relative; }
  svg { width:100%; height:100%; display:block; }
  aside { border-left:1px solid #1f2a47; display:flex; flex-direction:column; min-height:0; }
  .phases { display:flex; flex-wrap:wrap; gap:6px; padding:12px; border-bottom:1px solid #1f2a47; }
  .phase { padding:4px 8px; border-radius:999px; background:#1b2540; color:var(--muted); font-size:12px; }
  .phase.active { background:var(--accent); color:#fff; }
  .phase.done { background:#16402f; color:var(--ok); }
  #log { flex:1; overflow:auto; padding:10px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
  .ev { padding:3px 0; border-bottom:1px dashed #1b2540; white-space:pre-wrap; }
  .ev .agent { color:var(--accent); }
  .ev.warning { color:var(--warn); } .ev.error { color:var(--err); } .ev.success { color:var(--ok); }
  .legend { position:absolute; left:12px; bottom:12px; background:rgba(18,26,47,.9); padding:8px 10px; border-radius:8px; font-size:12px; }
  .legend span { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  #approve { display:none; margin:10px 12px; background:var(--warn); color:#000; border:0; padding:8px; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>RepoSplit 2.0 &middot; Untangling Dashboard</h1>
  <input id="repo" value="examples/shop_monolith" placeholder="repo path" />
  <label><input type="checkbox" id="live" /> live parity</label>
  <button id="start">Run</button>
  <button id="untangle" class="secondary" disabled>Untangle</button>
  <span id="status" style="color:var(--muted)"></span>
</header>
<main>
  <div id="graph"><svg></svg><div class="legend" id="legend"></div></div>
  <aside>
    <div class="phases" id="phases"></div>
    <div style="display:flex; border-bottom:1px solid #1f2a47;">
      <button id="tab-log-btn" style="flex:1; background:transparent; border:none; border-bottom:2px solid var(--accent); color:var(--ink); padding:8px; cursor:pointer; font-weight:600; font-size:12px;">Telemetry Log</button>
      <button id="tab-customizer-btn" style="flex:1; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--muted); padding:8px; cursor:pointer; font-weight:600; font-size:12px;">Domain Customizer (HITL)</button>
    </div>
    <div id="finops-card" style="display:none; padding:10px 12px; background:#122538; border-bottom:1px solid #1f2a47; font-size:12px;">
      <div style="display:flex; justify-content:space-between; font-weight:600; color:var(--ok); margin-bottom:4px;">
        <span>FinOps Cloud ROI</span>
        <span id="finops-savings">-</span>
      </div>
      <div style="font-size:11px; color:var(--muted);" id="finops-sub"></div>
      <div style="margin-top:8px; text-align:right;">
        <a href="/api/certificate" target="_blank" style="color:var(--accent); text-decoration:none; font-weight:600; font-size:11px;">View Executive Certificate (PDF) &rarr;</a>
      </div>
    </div>
    <div id="log-panel" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
      <button id="approve">Approve scaffolding (human oversight gate)</button>
      <div id="log"></div>
    </div>
    <div id="customizer-panel" style="display:none; flex:1; flex-direction:column; overflow:auto; padding:12px; font-size:12px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <strong style="color:var(--ink); font-size:13px;">Human-in-the-Loop Override</strong>
        <span id="custom-badge" style="background:#16402f; color:var(--ok); padding:2px 6px; border-radius:4px; font-size:10px;">EU AI Act Art 14</span>
      </div>
      <div style="background:#1b2540; padding:10px; border-radius:6px; margin-bottom:10px; display:grid; grid-template-columns:1fr 1fr; gap:6px;">
        <div>Coupling: <strong id="custom-severed" style="color:var(--ok)">-</strong></div>
        <div>Decoupled: <strong id="custom-reduction" style="color:var(--accent)">-</strong></div>
        <div>Severed Cuts: <strong id="custom-edges">-</strong></div>
        <div>Risk Level: <strong id="custom-risk">-</strong></div>
      </div>
      <div id="custom-cycles-alert" style="display:none; background:#3b1d1d; border:1px solid #ff5d5d; color:#ffb4b4; padding:8px 10px; border-radius:6px; margin-bottom:10px; font-size:11px;">
        <strong>⚠️ Circular Deadlock Detected:</strong>
        <div id="custom-cycles-text" style="margin-top:3px; color:#ffcccc;"></div>
      </div>
      <div style="background:#121a2f; border:1px solid #1f2a47; padding:8px; border-radius:6px; margin-bottom:10px; display:flex; gap:6px;">
        <input id="input-new-service" placeholder="new_service_name" style="flex:1; background:#1b2540; border:1px solid #2a3557; color:var(--ink); padding:4px 8px; border-radius:4px; font-size:11px;" />
        <button id="btn-add-service" style="background:#2a3557; color:#fff; border:0; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px; white-space:nowrap;">+ Add Service</button>
      </div>
      <button id="btn-apply-run" style="width:100%; background:linear-gradient(135deg, #4f8cff, #3ddc97); color:#000; font-weight:700; border:0; padding:9px; border-radius:6px; cursor:pointer; margin-bottom:8px; font-size:12px;">
        ⚡ Apply &amp; Run Modernization
      </button>
      <div style="display:flex; gap:8px; margin-bottom:10px;">
        <button id="btn-save-override" style="flex:1; background:var(--accent); color:#fff; border:0; padding:6px; border-radius:4px; cursor:pointer;">Save Override JSON</button>
        <button id="btn-reset-override" class="secondary" style="background:#2a3557; color:#fff; border:0; padding:6px; border-radius:4px; cursor:pointer;">Reset</button>
      </div>
      <div id="custom-status" style="font-size:11px; color:var(--ok); margin-bottom:8px;"></div>
      <div style="font-weight:600; color:var(--muted); margin-bottom:6px;">Symbols &amp; Models Assignment:</div>
      <div id="symbol-list" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>
  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const PHASES = ["INGEST","ARCHITECT","DATA","CONTRACT","STRANGLER","SCAFFOLD","PARITY","GOVERNANCE","COMPLETE"];
const color = d3.scaleOrdinal(d3.schemeTableau10);
let runId = null, sim = null, untangled = false, graphData = null;

const phasesEl = document.getElementById("phases");
PHASES.forEach(p => { const s = document.createElement("span"); s.className = "phase"; s.id = "ph-" + p; s.textContent = p; phasesEl.appendChild(s); });

function setPhase(phase) {
  let passed = true;
  PHASES.forEach(p => { const el = document.getElementById("ph-" + p); el.className = "phase" + (p === phase ? " active" : passed ? " done" : ""); if (p === phase) passed = false; });
}

function log(ev) {
  const div = document.createElement("div");
  div.className = "ev " + ev.level;
  div.innerHTML = `<span class="agent">[${ev.agent}]</span> ${ev.message}`;
  const logEl = document.getElementById("log");
  logEl.appendChild(div); logEl.scrollTop = logEl.scrollHeight;
  setPhase(ev.phase);
  if (ev.payload && ev.payload.approval_required) document.getElementById("approve").style.display = "block";
  if (ev.payload && ev.payload.annual_savings_usd) {
    document.getElementById("finops-card").style.display = "block";
    document.getElementById("finops-savings").textContent = `${Math.round(ev.payload.savings_percent)}% savings ($${Math.round(ev.payload.annual_savings_usd).toLocaleString()}/yr)`;
    document.getElementById("finops-sub").textContent = `Verified in Migration Passport | Infrastructure efficiency multiple`;
  }
  if (ev.agent === "architect" && ev.message.startsWith("parsed")) loadGraph(false);
  if (ev.agent === "architect" && ev.level === "success") { loadGraph(true); document.getElementById("untangle").disabled = false; }
}

async function loadGraph(withClusters) {
  const res = await fetch(`/api/runs/${runId}/graph`);
  if (!res.ok) return;
  graphData = await res.json();
  draw(withClusters);
}

function draw(withClusters) {
  const svg = d3.select("svg"); svg.selectAll("*").remove();
  const { width, height } = svg.node().getBoundingClientRect();
  const nodes = graphData.nodes.map(d => ({ ...d }));
  const links = graphData.edges.map(d => ({ ...d }));
  const clusters = graphData.clusters;
  const legend = document.getElementById("legend");
  legend.innerHTML = clusters.map(c => `<div><span style="background:${color(c)}"></span>${c}</div>`).join("");
  const cx = d3.scalePoint().domain(clusters).range([width * 0.15, width * 0.85]);

  const link = svg.append("g").selectAll("line").data(links).join("line")
    .attr("stroke", d => d.severed && untangled ? "#ff5d5d" : "#2a3557")
    .attr("stroke-dasharray", d => d.severed && untangled ? "4 3" : null)
    .attr("stroke-width", d => Math.min(4, 0.8 + d.weight * 0.4));
  const node = svg.append("g").selectAll("circle").data(nodes).join("circle")
    .attr("r", d => d.is_model ? 9 : d.route ? 7 : 5)
    .attr("fill", d => untangled ? color(d.cluster) : "#8a96b3")
    .attr("stroke", d => d.is_model ? "#fff" : "none").attr("stroke-width", 1.5)
    .call(d3.drag().on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
  node.append("title").text(d => `${d.id}\ncluster: ${d.cluster}${d.route ? "\nroute: " + d.route : ""}`);
  const label = svg.append("g").selectAll("text").data(nodes).join("text").text(d => d.name)
    .attr("font-size", 10).attr("fill", "#c8d0e6").attr("dx", 8).attr("dy", 3);

  sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(d => d.severed && untangled ? 160 : 40).strength(d => d.severed && untangled ? 0.05 : 0.6))
    .force("charge", d3.forceManyBody().strength(-160))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("x", d3.forceX(d => untangled ? cx(d.cluster) : width / 2).strength(untangled ? 0.35 : 0.02))
    .force("y", d3.forceY(height / 2).strength(0.05))
    .on("tick", () => {
      link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      node.attr("cx", d => d.x).attr("cy", d => d.y);
      label.attr("x", d => d.x).attr("y", d => d.y);
    });
}

document.getElementById("untangle").onclick = () => { untangled = !untangled; draw(untangled); };
document.getElementById("approve").onclick = async () => { await fetch(`/api/runs/${runId}/approve`, { method: "POST" }); document.getElementById("approve").style.display = "none"; };
document.getElementById("start").onclick = async () => {
  const res = await fetch("/api/runs", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ repo_path: document.getElementById("repo").value, live: document.getElementById("live").checked, require_approval: true }) });
  const data = await res.json();
  if (!res.ok) { document.getElementById("status").textContent = data.detail; return; }
  runId = data.run_id; untangled = false;
  document.getElementById("status").textContent = "run " + runId;
  document.getElementById("log").innerHTML = "";
  const es = new EventSource(`/api/runs/${runId}/events`);
  es.addEventListener("telemetry", e => log(JSON.parse(e.data)));
  es.addEventListener("end", () => { es.close(); document.getElementById("status").textContent += " - finished"; });
};

async function init() {
  try {
    const res = await fetch("/api/latest");
    if (!res.ok) return;
    const data = await res.json();
    if (!data.has_run) return;
    if (data.finops) {
      document.getElementById("finops-card").style.display = "block";
      document.getElementById("finops-savings").textContent = `${Math.round(data.finops.savings_percent)}% savings ($${Math.round(data.finops.annual_savings_usd).toLocaleString()}/yr)`;
      document.getElementById("finops-sub").textContent = `Monolith: $${Math.round(data.finops.monolith_baseline.total_monthly_usd)}/mo -> Microservices: $${Math.round(data.finops.modernized_fleet.total_monthly_usd)}/mo`;
    }
    const gRes = await fetch("/api/latest/graph");
    if (gRes.ok) {
      graphData = await gRes.json();
      draw(true);
      document.getElementById("untangle").disabled = false;
      document.getElementById("status").textContent = `Verified run ${data.run_id} (${data.parity.passRate || '100%'} parity)`;
      setPhase("COMPLETE");
    }
  } catch (e) {
    console.error(e);
  }
}
// Tab Switching
const tabLogBtn = document.getElementById("tab-log-btn");
const tabCustomizerBtn = document.getElementById("tab-customizer-btn");
const logPanel = document.getElementById("log-panel");
const customizerPanel = document.getElementById("customizer-panel");

tabLogBtn.onclick = () => {
  tabLogBtn.style.borderBottom = "2px solid var(--accent)";
  tabLogBtn.style.color = "var(--ink)";
  tabCustomizerBtn.style.borderBottom = "2px solid transparent";
  tabCustomizerBtn.style.color = "var(--muted)";
  logPanel.style.display = "flex";
  customizerPanel.style.display = "none";
};

tabCustomizerBtn.onclick = () => {
  tabCustomizerBtn.style.borderBottom = "2px solid var(--accent)";
  tabCustomizerBtn.style.color = "var(--ink)";
  tabLogBtn.style.borderBottom = "2px solid transparent";
  tabLogBtn.style.color = "var(--muted)";
  logPanel.style.display = "none";
  customizerPanel.style.display = "flex";
  loadCustomizerData();
};

let customAssignments = {};
let availableClusters = [];
let baselineTopology = null;

async function loadCustomizerData() {
  try {
    const res = await fetch("/api/topology");
    if (!res.ok) return;
    const data = await res.json();
    baselineTopology = data.topology;
    availableClusters = Object.keys(data.topology.clusters || {});
    if (!availableClusters.includes("shared_kernel")) availableClusters.push("shared_kernel");

    updateCustomizerMetrics({
      initial_coupling: data.topology.initial_coupling,
      severed_coupling: data.topology.severed_coupling,
      coupling_reduction_pct: data.topology.initial_coupling > 0 ? Math.round((1 - data.topology.severed_coupling / data.topology.initial_coupling) * 100) : 0,
      severed_edges_count: (data.topology.severed_edges || []).length,
      risk_level: data.topology.risk_level,
    });

    customAssignments = {};
    for (const [cname, cluster] of Object.entries(data.topology.clusters || {})) {
      for (const sid of cluster.symbols || []) {
        customAssignments[sid] = cname;
      }
    }

    renderSymbolList(data.symbols || []);
  } catch (err) {
    console.error("Failed to load topology:", err);
  }
}

function updateCustomizerMetrics(metrics) {
  document.getElementById("custom-severed").textContent = `${metrics.initial_coupling.toFixed(2)} -> ${metrics.severed_coupling.toFixed(2)}`;
  document.getElementById("custom-reduction").textContent = `${metrics.coupling_reduction_pct}%`;
  document.getElementById("custom-edges").textContent = `${metrics.severed_edges_count} edges`;
  const riskEl = document.getElementById("custom-risk");
  riskEl.textContent = metrics.risk_level.toUpperCase();
  riskEl.style.color = metrics.risk_level === "low" ? "var(--ok)" : metrics.risk_level === "medium" ? "var(--warn)" : "var(--err)";

  const cyclesAlert = document.getElementById("custom-cycles-alert");
  const cyclesText = document.getElementById("custom-cycles-text");
  if (metrics.cycles && metrics.cycles.length > 0) {
    cyclesAlert.style.display = "block";
    cyclesText.innerHTML = metrics.cycles.map(c => `<code>${c.members.join(" &harr; ")}</code><div style="font-size:10px; color:#ffd0d0; margin-top:2px;">${c.resolution}</div>`).join("<hr style='border:0; border-top:1px dashed #ff8888; margin:4px 0;'>");
  } else {
    cyclesAlert.style.display = "none";
  }
}

document.getElementById("btn-add-service").onclick = () => {
  const input = document.getElementById("input-new-service");
  let val = input.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "_");
  if (!val) return;
  if (!val.endsWith("_service") && val !== "shared_kernel") val += "_service";
  if (!availableClusters.includes(val)) {
    availableClusters.push(val);
    document.querySelectorAll("#symbol-list select").forEach(sel => {
      const opt = document.createElement("option");
      opt.value = val;
      opt.textContent = val;
      sel.appendChild(opt);
    });
    const statusEl = document.getElementById("custom-status");
    statusEl.textContent = `Added service: ${val}`;
    setTimeout(() => { statusEl.textContent = ""; }, 3000);
  }
  input.value = "";
};

function renderSymbolList(symbols) {
  const container = document.getElementById("symbol-list");
  container.innerHTML = "";
  symbols.sort((a, b) => (b.is_model ? 1 : 0) - (a.is_model ? 1 : 0) || a.name.localeCompare(b.name));

  symbols.forEach(sym => {
    const row = document.createElement("div");
    row.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#121a2f; border:1px solid #1f2a47; padding:6px 8px; border-radius:4px;";

    const label = document.createElement("div");
    label.style.cssText = "overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px;";
    label.innerHTML = `<strong style="color:${sym.is_model ? '#fff' : 'var(--ink)'}">${sym.name}</strong> <span style="color:var(--muted); font-size:10px;">(${sym.kind})</span>`;
    label.title = `${sym.id} (${sym.module})`;

    const select = document.createElement("select");
    select.style.cssText = "background:#1b2540; border:1px solid #2a3557; color:var(--ink); padding:4px 6px; border-radius:4px; font-size:11px; max-width:160px;";

    const currentCl = customAssignments[sym.id] || "shared_kernel";
    availableClusters.forEach(cl => {
      const opt = document.createElement("option");
      opt.value = cl;
      opt.textContent = cl;
      if (cl === currentCl) opt.selected = true;
      select.appendChild(opt);
    });

    select.onchange = async () => {
      customAssignments[sym.id] = select.value;
      await previewCustomTopology();
    };

    row.appendChild(label);
    row.appendChild(select);
    container.appendChild(row);
  });
}

async function previewCustomTopology() {
  try {
    const res = await fetch("/api/topology/preview", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ assignments: customAssignments }),
    });
    if (!res.ok) return;
    const preview = await res.json();
    updateCustomizerMetrics(preview);

    if (graphData && graphData.nodes) {
      graphData.nodes.forEach(n => {
        if (customAssignments[n.id]) {
          n.cluster = customAssignments[n.id];
        }
      });
      graphData.clusters = Array.from(new Set(graphData.nodes.map(n => n.cluster)));
      draw(true);
      if (sim) sim.alpha(0.4).restart();
    }
  } catch (err) {
    console.error("Preview failed:", err);
  }
}

document.getElementById("btn-apply-run").onclick = async () => {
  const statusEl = document.getElementById("custom-status");
  statusEl.textContent = "Launching pipeline with custom architecture...";
  try {
    const res = await fetch("/api/runs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        repo_path: document.getElementById("repo").value,
        live: document.getElementById("live").checked,
        require_approval: false,
        manual_assignments: customAssignments,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      statusEl.textContent = data.detail || "Error launching run";
      return;
    }
    runId = data.run_id;
    untangled = true;
    tabLogBtn.click();
    document.getElementById("status").textContent = `Run ${runId} (Human Override Active)`;
    document.getElementById("log").innerHTML = "";
    const es = new EventSource(`/api/runs/${runId}/events`);
    es.addEventListener("telemetry", e => log(JSON.parse(e.data)));
    es.addEventListener("end", () => {
      es.close();
      document.getElementById("status").textContent = `Run ${runId} finished (Human Override Attested)`;
    });
  } catch (err) {
    statusEl.textContent = "Failed to run: " + err;
  }
};

document.getElementById("btn-save-override").onclick = async () => {
  const statusEl = document.getElementById("custom-status");
  statusEl.textContent = "Saving override...";
  try {
    const res = await fetch("/api/topology/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ assignments: customAssignments }),
    });
    const data = await res.json();
    if (res.ok) {
      statusEl.textContent = `Saved to ${data.path} (${data.rules_count} rules)!`;
      setTimeout(() => { statusEl.textContent = ""; }, 4000);
    } else {
      statusEl.textContent = "Error saving override";
    }
  } catch (e) {
    statusEl.textContent = "Failed to save: " + e;
  }
};

document.getElementById("btn-reset-override").onclick = () => {
  loadCustomizerData();
};

init();
</script>
</body>
</html>
