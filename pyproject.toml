[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reposplit"
version = "2.0.0a1"
description = "RepoSplit 2.0 - Hierarchical Orchestrated Multi-Agent System (HOMAS) for monolith-to-microservice modernization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "RepoSplit Team" }]
keywords = ["microservices", "modernization", "multi-agent", "ibm-bob", "ast", "saga", "strangler-fig"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "pydantic>=2.7",
  "networkx>=3.2",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "cryptography>=42",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
langchain = [
  "langchain-core>=0.3",
  "langchain-groq>=0.2",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "flask>=3.0",
  "flask-sqlalchemy>=3.1",
  "sqlalchemy>=2.0",
]
all = ["reposplit[anthropic,langchain,dev]"]

[project.scripts]
reposplit = "reposplit.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/reposplit-multi-agent"

[tool.setuptools.packages.find]
include = ["reposplit*"]

[tool.setuptools.package-data]
reposplit = ["generators/templates/**/*", "api/static/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["I"]  # the monolith uses flat top-level modules on purpose

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
